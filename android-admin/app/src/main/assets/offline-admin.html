<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>HydrogenRO offline</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #142033;
      --muted: #5c6b80;
      --line: #e4ebf3;
      --card: #ffffff;
      --bg: #f3f6fb;
      --sky: #0ea5e9;
      --sky-dark: #0284c7;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    .wrap {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      padding: calc(16px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));
    }
    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .brand { font-weight: 700; letter-spacing: -0.03em; font-size: 18px; }
    .brand span { color: var(--sky-dark); }
    .sub { margin: 4px 0 0; color: var(--muted); font-size: 13px; line-height: 1.4; }
    .live {
      flex: 0 0 auto;
      border: 0;
      background: var(--ink);
      color: white;
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .live:active { transform: translateY(1px); }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 18px;
    }
    .field {
      position: relative;
      flex: 1;
      min-width: 0;
    }
    .field svg {
      position: absolute;
      left: 12px;
      top: 50%;
      width: 16px;
      height: 16px;
      margin-top: -8px;
      fill: none;
      stroke: #94a3b8;
      stroke-width: 2;
      pointer-events: none;
    }
    input {
      width: 100%;
      height: 40px;
      border: 1px solid #d1d5db;
      background: white;
      border-radius: 8px;
      padding: 0 12px 0 36px;
      font-size: 16px;
      color: var(--ink);
      outline: none;
    }
    input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
    .search, .clear {
      height: 40px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 650;
      flex: 0 0 auto;
    }
    .search {
      border: 0;
      background: #2563eb;
      color: white;
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .search:disabled { opacity: 0.45; }
    .search svg { width: 16px; height: 16px; fill: none; stroke: white; stroke-width: 2; }
    .clear {
      width: 40px;
      border: 1px solid #d1d5db;
      background: white;
      color: #334155;
    }
    .hint {
      min-height: 18px;
      margin: 8px 2px 0;
      color: #b45309;
      font-size: 13px;
    }
    #list { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 16px;
    }
    .name { font-weight: 650; font-size: 16px; }
    .phone { margin-top: 4px; color: var(--muted); font-size: 14px; }
    .empty {
      margin-top: 28px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      padding: 0 12px;
    }
    .mask {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 16px;
    }
    .mask.show { display: flex; }
    .ask {
      width: min(440px, 100%);
      background: white;
      border-radius: 22px;
      padding: 20px 18px 16px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.18);
    }
    .ask h2 { margin: 0; font-size: 18px; letter-spacing: -0.03em; }
    .ask p { margin: 8px 0 0; color: var(--muted); font-size: 14px; line-height: 1.45; }
    .actions { display: flex; gap: 8px; margin-top: 16px; }
    .actions button { flex: 1; border-radius: 12px; padding: 12px 10px; font-size: 15px; font-weight: 650; }
    .no { border: 1px solid var(--line); background: white; color: var(--ink); }
    .yes { border: 0; background: var(--sky); color: white; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <div class="brand">Hydrogen<span>RO</span></div>
        <p class="sub">Saved customers on this phone. The live admin stays closed until you open it.</p>
      </div>
      <button class="live" type="button" id="liveBtn">Connect to live</button>
    </header>
    <form id="searchForm" class="row" action="#" autocomplete="off">
      <div class="field">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="text" inputmode="text" enterkeyhint="search" placeholder="Search by name, phone, or alternate number" autocomplete="off" autocapitalize="off" />
      </div>
      <button class="search" id="searchBtn" type="submit" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        Search
      </button>
      <button class="clear" id="clearBtn" type="button" hidden aria-label="Clear">×</button>
    </form>
    <p class="hint" id="hint"></p>
    <div id="list"></div>
    <p class="empty" id="empty">Enter a name or phone number, then tap Search.</p>
  </div>
  <div class="mask" id="mask">
    <div class="ask">
      <h2>Open the live admin?</h2>
      <p>The connection is back. Live pages, photos, and new jobs load only after you confirm.</p>
      <div class="actions">
        <button class="no" type="button" id="stay">Not now</button>
        <button class="yes" type="button" id="go">Open live</button>
      </div>
    </div>
  </div>
  <script>
    var asked = false;
    var q = document.getElementById('q');
    var list = document.getElementById('list');
    var empty = document.getElementById('empty');
    var hint = document.getElementById('hint');
    var searchBtn = document.getElementById('searchBtn');
    var clearBtn = document.getElementById('clearBtn');
    var mask = document.getElementById('mask');

    function digitsOnly(value) {
      return String(value || '').replace(/\D/g, '');
    }

    function syncButtons() {
      var text = q.value.trim();
      searchBtn.disabled = text.length === 0;
      clearBtn.hidden = q.value.length === 0;
    }

    function showHint(message) {
      hint.textContent = message || '';
    }

    function render(rows, message) {
      list.innerHTML = '';
      showHint('');
      if (!rows.length) {
        empty.style.display = 'block';
        empty.textContent = message || 'No saved customer matches that search.';
        return;
      }
      empty.style.display = 'none';
      rows.forEach(function (row) {
        var card = document.createElement('div');
        card.className = 'card';
        var name = document.createElement('div');
        name.className = 'name';
        name.textContent = row.name || 'Customer';
        var phone = document.createElement('div');
        phone.className = 'phone';
        phone.textContent = phoneText(row) || 'No number saved';
        card.appendChild(name);
        card.appendChild(phone);
        list.appendChild(card);
      });
    }

    function runSearch() {
      var value = q.value.trim();
      if (value !== q.value) q.value = value;
      syncButtons();
      if (!value) {
        list.innerHTML = '';
        empty.style.display = 'block';
        empty.textContent = 'Enter a name or phone number, then tap Search.';
        showHint('Enter a name or phone number.');
        return;
      }
      if (value.length < 2) {
        list.innerHTML = '';
        empty.style.display = 'block';
        empty.textContent = 'Type at least 2 characters.';
        showHint('Type at least 2 characters.');
        return;
      }
      var digits = digitsOnly(value);
      if (digits.length > 0 && digits.length < 4 && digits === value.replace(/\s/g, '')) {
        list.innerHTML = '';
        empty.style.display = 'block';
        empty.textContent = 'Enter at least 4 digits of the phone number.';
        showHint('Enter at least 4 digits of the phone number.');
        return;
      }
      if (!window.HroOffline) {
        showHint('Search is not ready. Close the app and open it again.');
        return;
      }
      try {
        var rows = JSON.parse(window.HroOffline.search(value) || '[]');
        render(rows);
      } catch (e) {
        render([], 'Search failed. Try again.');
      }
    }

    q.addEventListener('input', function () {
      syncButtons();
      showHint('');
    });
    q.addEventListener('touchend', function (event) {
      event.preventDefault();
      q.focus();
    });
    q.addEventListener('paste', function (event) {
      var pasted = (event.clipboardData && event.clipboardData.getData('text')) || '';
      var digits = digitsOnly(pasted);
      if (digits.length >= 10) {
        event.preventDefault();
        q.value = digits.slice(-10);
        syncButtons();
        runSearch();
      }
    });
    document.getElementById('searchForm').addEventListener('submit', function (event) {
      event.preventDefault();
      runSearch();
    });
    clearBtn.addEventListener('click', function () {
      q.value = '';
      syncButtons();
      list.innerHTML = '';
      empty.style.display = 'block';
      empty.textContent = 'Enter a name or phone number, then tap Search.';
      showHint('');
      q.focus();
    });

    function phoneText(row) {
      var parts = [];
      if (row.phone) parts.push(row.phone);
      if (row.alt && row.alt !== row.phone) parts.push(row.alt);
      return parts.join(' · ');
    }

    function askLive() {
      var online = false;
      try { online = !!(window.HroOffline && window.HroOffline.online()); } catch (e) {}
      if (!online) {
        empty.style.display = 'block';
        empty.textContent = 'Still offline. Connect to live appears when the network is back.';
        return;
      }
      mask.classList.add('show');
    }

    document.getElementById('liveBtn').addEventListener('click', askLive);
    document.getElementById('stay').addEventListener('click', function () {
      mask.classList.remove('show');
    });
    document.getElementById('go').addEventListener('click', function () {
      mask.classList.remove('show');
      if (window.HroOffline) window.HroOffline.openLive();
    });
    window.__hroNet = function (online) {
      if (!online || asked) return;
      asked = true;
      mask.classList.add('show');
    };
  </script>
</body>
</html>
